<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/website_logo.svg" />
    <title>Thomas Fieguth | Robotics Engineer</title>
    <meta name="description" content="Thomas Fieguth, robotics engineer. Autonomous tractor guidance software, an award-winning depth-sensing capstone, CNC woodworking and welding projects." />
    <link rel="canonical" href="https://thomasfieguth.ca/" />

    <!-- Link previews (LinkedIn, Slack, iMessage, ...). scripts/prerender.mjs
         rewrites the per-page values in each route's static HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thomas Fieguth" />
    <meta property="og:title" content="Thomas Fieguth | Robotics Engineer" />
    <meta property="og:description" content="Thomas Fieguth, robotics engineer. Autonomous tractor guidance software, an award-winning depth-sensing capstone, CNC woodworking and welding projects." />
    <meta property="og:url" content="https://thomasfieguth.ca/" />
    <meta property="og:image" content="https://thomasfieguth.ca/assets/images/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Thomas Fieguth",
        "url": "https://thomasfieguth.ca",
        "jobTitle": "Robotics Engineer",
        "sameAs": [
          "https://www.linkedin.com/in/thomas-fieguth-59b19427b/",
          "https://github.com/thomasfieguth"
        ]
      }
    </script>

    <!-- With JavaScript running, React replaces the static page copy that
         scripts/prerender.mjs puts in #root; hide it so it never flashes
         up unstyled first. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js .prerender { display: none; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

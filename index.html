<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/website_logo.svg" />
    <title>Thomas Fieguth · Robotics &amp; Mechatronics Engineer</title>
    <meta name="description" content="Robotics &amp; mechatronics engineer. Portfolio of autonomous tractor guidance software, an award-winning depth-sensing capstone, CNC woodworking and fabrication projects." />
    <link rel="canonical" href="https://thomasfieguth.github.io/" />

    <!-- Link previews (LinkedIn, Slack, iMessage, ...). scripts/prerender.mjs
         rewrites the per-page values in each route's static HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thomas Fieguth" />
    <meta property="og:title" content="Thomas Fieguth · Robotics &amp; Mechatronics Engineer" />
    <meta property="og:description" content="Robotics &amp; mechatronics engineer. Portfolio of autonomous tractor guidance software, an award-winning depth-sensing capstone, CNC woodworking and fabrication projects." />
    <meta property="og:url" content="https://thomasfieguth.github.io/" />
    <meta property="og:image" content="https://thomasfieguth.github.io/assets/images/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- With JavaScript running, React replaces the static page copy that
         scripts/prerender.mjs puts in #root; hide it so it never flashes
         up unstyled first. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js .prerender { display: none; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
